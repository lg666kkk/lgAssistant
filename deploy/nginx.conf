# Public HTTP entrypoint for aicharleslg.com.
#
# Certbot adds the HTTPS server and certificate directives in this file after
# the site is enabled (see DEPLOY.md). Keep this HTTP listener available so
# Let's Encrypt can complete the HTTP-01 challenge.
server {
  listen 80;
  server_name aicharleslg.com www.aicharleslg.com;

  # 32 MiB of raw images expands to roughly 43 MiB when sent as base64 JSON.
  client_max_body_size 50m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Agent responses use SSE and can run longer than ordinary HTTP requests.
  location /api/chat {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }
}
