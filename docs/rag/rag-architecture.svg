<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Personal Assistant Agentic RAG 架构图</title>
  <desc id="desc">展示当前项目的 Notion 知识摄取、混合索引、检索路由、并行召回、证据分级、引用回答和可观测性。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172033" flood-opacity=".10"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#697586"/></marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#1580A9"/></marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#21836B"/></marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#C77720"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033;letter-spacing:0}
      .h1{font-size:32px;font-weight:750}.sub{font-size:15px;fill:#5D6878}.band{font-size:19px;font-weight:720}.nt{font-size:17px;font-weight:700}.tx{font-size:13px;fill:#596678}.xs{font-size:11px;fill:#6C7787}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
      .card{fill:#fff;stroke:#D6DCE4;stroke-width:1.4;rx:7;filter:url(#shadow)}.inner{fill:#F8FAFC;stroke:#D8DEE6;stroke-width:1.2;rx:6}
      .line{fill:none;stroke:#697586;stroke-width:2;marker-end:url(#arr)}.blue{stroke:#1580A9;marker-end:url(#arrBlue)}.green{stroke:#21836B;marker-end:url(#arrGreen)}.orange{stroke:#C77720;marker-end:url(#arrOrange)}.dash{stroke-dasharray:7 6}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F5F7FA"/>
  <rect width="1920" height="104" fill="#fff"/>
  <line x1="0" y1="103" x2="1920" y2="103" stroke="#DEE3EA"/>
  <text x="52" y="47" class="h1">Personal Assistant · Agentic RAG 架构</text>
  <text x="52" y="77" class="sub">私有知识库按需检索，证据进入 Agent Loop；长期记忆召回是独立系统，不在本图范围内</text>
  <g transform="translate(1518 36)">
    <rect width="102" height="28" rx="5" fill="#E6F4FA" stroke="#AFD8E8"/><circle cx="15" cy="14" r="5" fill="#1580A9"/><text x="27" y="19" class="tx">离线摄取</text>
    <rect x="112" width="102" height="28" rx="5" fill="#E8F5EF" stroke="#B0DACC"/><circle cx="127" cy="14" r="5" fill="#21836B"/><text x="139" y="19" class="tx">在线检索</text>
    <rect x="224" width="112" height="28" rx="5" fill="#FFF1DF" stroke="#EBCB9F"/><circle cx="239" cy="14" r="5" fill="#C77720"/><text x="251" y="19" class="tx">证据治理</text>
  </g>

  <!-- A: ingestion -->
  <rect x="32" y="124" width="1856" height="270" rx="8" fill="#EDF7FB" stroke="#C3E0EB"/>
  <rect x="32" y="124" width="7" height="270" fill="#1580A9"/>
  <text x="60" y="158" class="band" fill="#135F7C">A. 离线知识摄取与索引</text>
  <text x="304" y="158" class="sub">版本检查 · 批量重试 · 页面级原子替换</text>

  <g>
    <rect x="60" y="187" width="202" height="148" class="card"/><rect x="60" y="187" width="202" height="6" rx="3" fill="#1B9CC5"/>
    <circle cx="89" cy="220" r="13" fill="#DDF2F9"/><path d="M83 213h10l5 5v13H83zm10 0v6h6" fill="none" stroke="#1580A9" stroke-width="1.8"/>
    <text x="112" y="226" class="nt">Notion 知识源</text><text x="80" y="260" class="tx">用户级加密连接配置</text><text x="80" y="284" class="tx">页面 / 子页面 / Blocks</text><text x="80" y="310" class="mono" fill="#1580A9">source_type: notion</text>
  </g>
  <g>
    <rect x="302" y="178" width="234" height="108" class="card"/><rect x="302" y="178" width="6" height="108" rx="3" fill="#1B9CC5"/>
    <circle cx="332" cy="210" r="13" fill="#DDF2F9"/><text x="328" y="215" font-size="14" font-weight="800" fill="#1580A9">1</text>
    <text x="355" y="216" class="nt">同步入口</text><text x="322" y="248" class="mono">POST /api/knowledge/sync</text><text x="322" y="271" class="tx">当前默认：NDJSON 流式同步</text>
    <rect x="302" y="302" width="234" height="63" rx="6" fill="#F8FBFD" stroke="#81BBD1" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="322" y="328" class="nt" font-size="15">可用异步摄取基础设施</text><text x="322" y="351" class="xs">queue · lease · retry · dead · snapshot</text>
  </g>
  <g>
    <rect x="580" y="187" width="202" height="148" class="card"/><rect x="580" y="187" width="202" height="6" rx="3" fill="#1B9CC5"/>
    <circle cx="609" cy="220" r="13" fill="#DDF2F9"/><text x="605" y="225" font-size="14" font-weight="800" fill="#1580A9">2</text>
    <text x="632" y="226" class="nt">Notion Loader</text><text x="600" y="260" class="tx">递归读取页面树与 blocks</text><text x="600" y="284" class="tx">保留标题、URL、更新时间</text><text x="600" y="310" class="mono" fill="#1580A9">NotionClient</text>
  </g>
  <g>
    <rect x="826" y="187" width="226" height="148" class="card"/><rect x="826" y="187" width="226" height="6" rx="3" fill="#1B9CC5"/>
    <circle cx="855" cy="220" r="13" fill="#DDF2F9"/><text x="851" y="225" font-size="14" font-weight="800" fill="#1580A9">3</text>
    <text x="878" y="226" class="nt">结构 / Token 切块</text><text x="846" y="260" class="tx">标题、段落、代码、表格感知</text><text x="846" y="284" class="tx">700 字符 / 450 token 双上限</text><text x="846" y="310" class="mono" fill="#1580A9">overlap: 50 tokens</text>
  </g>
  <g>
    <rect x="1096" y="187" width="210" height="148" class="card"/><rect x="1096" y="187" width="210" height="6" rx="3" fill="#1B9CC5"/>
    <circle cx="1125" cy="220" r="13" fill="#DDF2F9"/><text x="1121" y="225" font-size="14" font-weight="800" fill="#1580A9">4</text>
    <text x="1148" y="226" class="nt">Embedding</text><text x="1116" y="260" class="tx">用户配置 · 批量重试与校验</text><text x="1116" y="284" class="tx">默认 text-embedding-v4</text><text x="1116" y="310" class="mono" fill="#1580A9">vector(1024)</text>
  </g>
  <g>
    <rect x="1350" y="169" width="494" height="186" class="card"/><rect x="1350" y="169" width="6" height="186" rx="3" fill="#21836B"/>
    <circle cx="1380" cy="201" r="13" fill="#E0F3EB"/><text x="1376" y="206" font-size="14" font-weight="800" fill="#21836B">5</text><text x="1403" y="207" class="nt">Supabase / PostgreSQL</text>
    <rect x="1372" y="226" width="213" height="49" class="inner"/><text x="1386" y="248" class="mono" fill="#176650">notion_pages</text><text x="1386" y="266" class="xs">content / index version</text>
    <rect x="1597" y="226" width="225" height="49" class="inner"/><text x="1611" y="248" class="mono" fill="#176650">documents</text><text x="1611" y="266" class="xs">HNSW + FTS / LIKE</text>
    <rect x="1372" y="286" width="213" height="49" class="inner"/><text x="1386" y="308" class="mono" fill="#176650">knowledge_profiles</text><text x="1386" y="326" class="xs">路由画像 / indexVersion</text>
    <rect x="1597" y="286" width="225" height="49" class="inner"/><text x="1611" y="308" class="mono" fill="#176650">atomic replace RPC</text><text x="1611" y="326" class="xs">页面级事务提交</text>
  </g>
  <path d="M262 261h40" class="line blue"/><path d="M536 232h44" class="line blue"/><path d="M536 333h22v-48h22" class="line blue dash"/><path d="M782 261h44" class="line blue"/><path d="M1052 261h44" class="line blue"/><path d="M1306 261h44" class="line green"/>

  <!-- B: online -->
  <rect x="32" y="414" width="1856" height="626" rx="8" fill="#F1F8F5" stroke="#C4E0D5"/>
  <rect x="32" y="414" width="7" height="626" fill="#21836B"/>
  <text x="60" y="449" class="band" fill="#176650">B. 在线 Agentic RAG：路由 → 工具检索 → 证据化回答</text>
  <text x="548" y="449" class="sub">不是每轮自动注入：RetrievalPlan 提供路由约束，模型按需调用检索工具</text>

  <g>
    <rect x="60" y="492" width="172" height="132" class="card"/><rect x="60" y="492" width="6" height="132" rx="3" fill="#5969D8"/>
    <circle cx="90" cy="526" r="13" fill="#ECEEFC"/><path d="M84 526c0-5 3-8 7-8s7 3 7 8-3 7-7 7-7-3-7-7zm-5 18c2-6 7-9 12-9s10 3 12 9" fill="none" stroke="#5969D8" stroke-width="1.8"/>
    <text x="113" y="532" class="nt">用户问题</text><text x="80" y="566" class="tx">当前消息 + 最近对话</text><text x="80" y="591" class="tx">联网开关 / 用户身份</text>
  </g>
  <g>
    <rect x="270" y="482" width="224" height="152" class="card"/><rect x="270" y="482" width="6" height="152" rx="3" fill="#5969D8"/>
    <circle cx="300" cy="514" r="13" fill="#ECEEFC"/><text x="296" y="519" font-size="14" font-weight="800" fill="#5969D8">1</text><text x="323" y="520" class="nt">Chat Orchestration</text>
    <text x="290" y="550" class="mono">run-chat.ts</text><text x="290" y="575" class="tx">读取画像 / indexVersion</text><text x="290" y="599" class="tx">Prompt Pipe + 工具注册表</text><text x="290" y="622" class="xs">ReAct 或 Plan-and-Execute</text>
  </g>
  <g>
    <rect x="532" y="470" width="264" height="176" class="card"/><rect x="532" y="470" width="6" height="176" rx="3" fill="#C77720"/>
    <circle cx="562" cy="502" r="13" fill="#FFF0DD"/><text x="558" y="507" font-size="14" font-weight="800" fill="#C77720">2</text><text x="585" y="508" class="nt">RetrievalPlan 路由</text>
    <text x="552" y="538" class="tx">独立问题重写 · 类型判断 · 过滤器</text>
    <rect x="552" y="554" width="106" height="27" rx="5" fill="#E6F4FA" stroke="#AFD8E8"/><text x="572" y="573" class="tx">knowledge</text>
    <rect x="670" y="554" width="106" height="27" rx="5" fill="#F1F3F6" stroke="#D3DAE3"/><text x="711" y="573" class="tx">web</text>
    <rect x="552" y="590" width="106" height="27" rx="5" fill="#E8F5EF" stroke="#B0DACC"/><text x="590" y="609" class="tx">both</text>
    <rect x="670" y="590" width="106" height="27" rx="5" fill="#F1F3F6" stroke="#D3DAE3"/><text x="682" y="609" class="tx">no_retrieval</text>
    <text x="552" y="636" class="xs">显式来源请求 → evidenceRequired</text>
  </g>
  <g>
    <rect x="834" y="482" width="212" height="152" class="card"/><rect x="834" y="482" width="6" height="152" rx="3" fill="#21836B"/>
    <circle cx="864" cy="514" r="13" fill="#E0F3EB"/><text x="860" y="519" font-size="14" font-weight="800" fill="#21836B">3</text><text x="887" y="520" class="nt">Agent Loop</text>
    <text x="854" y="550" class="mono">search_notes</text><text x="854" y="575" class="tx">只读 · 每轮最多调用 1 次</text><text x="854" y="599" class="tx">最多 2 次同阈值 query</text><text x="854" y="622" class="xs">弱证据可触发确定性重写</text>
  </g>
  <g>
    <rect x="1084" y="482" width="228" height="152" class="card"/><rect x="1084" y="482" width="6" height="152" rx="3" fill="#21836B"/>
    <circle cx="1114" cy="514" r="13" fill="#E0F3EB"/><text x="1110" y="519" font-size="14" font-weight="800" fill="#21836B">4</text><text x="1137" y="520" class="nt">Query 准备</text>
    <text x="1104" y="550" class="tx">standalone query</text><text x="1104" y="575" class="tx">最多 3 个确定性改写变体</text><text x="1104" y="599" class="tx">批量 embedding + 10 分钟缓存</text><text x="1104" y="622" class="xs">tenant / indexVersion 隔离</text>
  </g>
  <path d="M232 558h38" class="line"/><path d="M494 558h38" class="line"/><path d="M796 558h38" class="line green"/><path d="M1046 558h38" class="line green"/>

  <!-- Retrieval engine -->
  <g>
    <rect x="270" y="706" width="1042" height="275" class="card"/><rect x="270" y="706" width="6" height="275" rx="3" fill="#21836B"/>
    <text x="296" y="740" class="nt">RAGRetriever · 混合检索流水线</text><text x="296" y="764" class="xs">候选池 min(TopK × 4, 50) · 全局 similarity threshold = 0.5</text>
    <rect x="296" y="792" width="242" height="128" rx="6" fill="#E8F5EF" stroke="#A5D2C1"/>
    <text x="314" y="819" class="nt" font-size="16">向量召回</text><text x="314" y="846" class="mono" fill="#176650">match_documents()</text><text x="314" y="871" class="tx">多 query 并行 · cosine</text><text x="314" y="895" class="tx">pgvector HNSW + 用户隔离</text>
    <rect x="296" y="934" width="242" height="31" rx="5" fill="#E6F4FA" stroke="#AFD8E8"/><text x="315" y="955" class="tx">关键词召回：FTS + LIKE 兜底</text>
    <path d="M566 856h52" class="line green"/><path d="M538 950h39v-62h41" class="line blue"/>
    <rect x="618" y="792" width="210" height="128" rx="6" fill="#FFF1DF" stroke="#E8C18A"/>
    <text x="636" y="819" class="nt" font-size="16">融合</text><text x="636" y="846" class="tx">默认 RRF · weighted 可选</text><text x="636" y="871" class="tx">多 query / 双路排名共识</text><text x="636" y="895" class="tx">页面 / 标题 / 时间过滤</text>
    <path d="M828 856h36" class="line green"/>
    <rect x="864" y="792" width="200" height="128" rx="6" fill="#F2EEFA" stroke="#C8BCE1"/>
    <text x="882" y="819" class="nt" font-size="16">重排</text><text x="882" y="846" class="tx">规则 rerank</text><text x="882" y="871" class="tx">条件 Cross-Encoder（可选）</text><text x="882" y="895" class="tx">失败时保留规则排序</text>
    <path d="M1064 856h36" class="line green"/>
    <rect x="1100" y="792" width="186" height="128" rx="6" fill="#EAF3FB" stroke="#AECBE2"/>
    <text x="1118" y="819" class="nt" font-size="16">MMR + 上下文</text><text x="1118" y="846" class="tx">向量 MMR · λ = 0.7</text><text x="1118" y="871" class="tx">parent context 去重</text><text x="1118" y="895" class="tx">Top 5 / 2400 tokens</text>
    <path d="M1198 634v46H417v102" class="line green"/>
    <path d="M1597 355v323H417v104" class="line green dash"/><text x="1428" y="669" class="xs" fill="#176650">documents 索引</text>
  </g>

  <!-- Evidence column -->
  <g>
    <rect x="1350" y="470" width="494" height="511" class="card"/><rect x="1350" y="470" width="6" height="511" rx="3" fill="#C77720"/>
    <circle cx="1380" cy="502" r="13" fill="#FFF0DD"/><text x="1376" y="507" font-size="14" font-weight="800" fill="#C77720">5</text><text x="1403" y="508" class="nt">证据治理与回答</text>
    <rect x="1376" y="535" width="442" height="88" rx="6" fill="#FFF7EB" stroke="#E8C18A"/>
    <text x="1394" y="562" class="nt" font-size="16">Evidence Grader</text><text x="1394" y="587" class="tx">top score · query coverage · score gap · 双路一致性</text><text x="1394" y="610" class="tx">充分 → 接受证据；不足 → 重写重试或明确无证据</text>
    <rect x="1376" y="645" width="442" height="91" rx="6" fill="#F2EEFA" stroke="#C8BCE1"/>
    <text x="1394" y="672" class="nt" font-size="16">EvidenceBundle → 模型上下文</text><text x="1394" y="697" class="tx">稳定 evidenceId · 原文 · 来源 URL · 分数</text><text x="1394" y="721" class="tx">RAG 内容只作为不可信数据，不拥有指令权限</text>
    <rect x="1376" y="758" width="442" height="72" rx="6" fill="#E8F5EF" stroke="#A5D2C1"/>
    <text x="1394" y="785" class="nt" font-size="16">LLM 生成引用回答</text><text x="1394" y="811" class="tx">事实句使用 [ev_xxxxxxxxxxxx] · 返回 answer + sources</text>
    <rect x="1376" y="852" width="442" height="86" rx="6" fill="#F8FAFC" stroke="#CBD3DE"/>
    <text x="1394" y="879" class="nt" font-size="16">Claim 级 Answer Verifier</text><text x="1394" y="904" class="tx">citation coverage / precision / groundedness</text><text x="1394" y="926" class="xs">当前仅写入 Trace / Eval，不拦截或改写流式回答</text>
    <path d="M1312 856h20v-277h44" class="line orange"/><path d="M1597 623v22" class="line orange"/><path d="M1597 736v22" class="line green"/><path d="M1597 830v22" class="line"/>
    <path d="M1376 579h-32v77H940v-22" class="line orange dash"/><text x="1080" y="647" class="xs" fill="#8C5319">证据不足且预算允许：第二次 query</text>
  </g>

  <!-- Observability -->
  <rect x="60" y="996" width="1784" height="25" rx="5" fill="#E7EBF1"/>
  <circle cx="81" cy="1008.5" r="5" fill="#5969D8"/>
  <text x="95" y="1013" class="xs">可观测性贯穿全链路：AgentTrace / Langfuse · route / attempt / cache / 阶段耗时 / Top Results / Evidence Grade / Answer Validation · RAG Eval 与消融脚本</text>
  <text x="1844" y="1060" text-anchor="end" class="xs">Source-grounded · 2026-09-04</text>
</svg>
